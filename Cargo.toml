[package]
name = "wreq_php"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "PHP HTTP client with deterministic connection pooling and browser TLS/HTTP2 fingerprinting, built on wreq"
# The project remains LGPL-3.0-or-later; current Rust dependencies are
# permissively licensed. See LICENSE and THIRD_PARTY_LICENSES.md.
license = "LGPL-3.0-or-later"

[lib]
name = "wreq_php"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
ext-php-rs = { version = "0.16.3", features = ["anyhow", "indexmap"] }
bytes = "1"
wreq = { version = "0.16.1", features = [
    "cookies",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "charset",
    "json",
    "form",
    "query",
    "multipart",
    "hickory-dns",
    "socks",
    "stream",
] }
wreq-util = { version = "0.2.0", features = [
    "emulation",
    "emulation-serde",
] }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures-util = "0.3"
serde_json = "1"
thiserror = "2"
indexmap = "2"

# On ELF targets PHP commonly loads OpenSSL into the same process. Prefix
# wreq's BoringSSL symbols there to prevent collisions. Upstream only supports
# this mitigation on Linux/Android; enabling it on macOS crashes on first TLS
# use with wreq 0.16.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wreq = { version = "0.16.1", features = ["prefix-symbols"] }

[build-dependencies]
ext-php-rs = { version = "0.16.3", features = ["anyhow"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Optional SETTINGS_INITIAL_WINDOW_SIZE omission; upstream: 0x676e67/wreq-proto#90.
# Patch applies to wreq-util too, keeping a single wreq type/dependency graph.
[patch.crates-io]
wreq = { git = "https://github.com/eav93/wreq.git", rev = "d7706a0a1e3f8ce1bf844187d6888f59ea124f99" }
wreq-proto = { git = "https://github.com/eav93/wreq-proto.git", rev = "75078215dac3802cbfdd3499c71de244e6e779ec" }
